<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

   <header>
        <h1>Instituto Viver Melhor</h1>

        <!-- Checkbox que controla o menu hambúrguer -->
        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-hamburguer">
            ☰
        </label>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Início</a>
                </li>

                <li class="item-projetos">

                    <!-- Checkbox que controla o submenu -->
                    <input type="checkbox" id="submenu-toggle">

                    <label for="submenu-toggle" class="submenu-botao">
                        Projetos ▾
                    </label>

                    <ul class="submenu">
                        <li>
                            <a href="projetos.html">Voluntariado</a>
                        </li>

                        <li>
                            <a href="projetos.html">Doações</a>
                        </li>
                    </ul>

                </li>

                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <form>
         <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome completo:</label>
             <input id="nome" name="nome" type="text" required>

             <label for="email">Email:</label>
             <input id="email" name="email" type="email" required>

             <label for="nascimento">Data de Nascimento:</label>
             <input id="nascimento" name="nascimento" type="date" required>

             <label for="cpf">CPF:</label>
              <input
               id="cpf"
               name="cpf"
               type="text"
               pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
               placeholder="000.000.000-00"
               required
                >

                <label for="telefone">Telefone:</label>
                <input
                  id="telefone"
                  name="telefone"
                  type="tel"
                  pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                  placeholder="(00) 00000-0000"
                  required
                  >
         </fieldset>

         <fieldset>
            <legend>Endereço</legend>

            <label for="endereco">Endereço:</label>
             <input id="endereco" name="endereco" type="text" required>

             <label for="cidade">Cidade:</label>
             <input id="cidade" name="cidade" type="text" required>

             <label for="estado">Estado:</label>
             <input id="estado" name="estado" type="text" required>

             <label for="cep">CEP:</label>
             <input
              id="cep"
              name="cep"
              type="text"
              pattern="[0-9]{5}-[0-9]{3}"
              placeholder="00000-000"
              required
              >
         </fieldset>

         <button type="submit">Cadastrar</button>

         
        </form>
    </main>
</body>
</html>
